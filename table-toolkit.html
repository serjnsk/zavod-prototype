<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Zavod Table Kit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --bg:#f4f5f7; --surface:#fff; --border:#e5e7eb; --border-strong:#d6dae1;
  --text:#1f2937; --text-2:#4b5563; --muted:#8a919e;
  --accent:#2563eb; --accent-bg:#eaf0fe; --accent-hover:#1d4ed8;
  --green:#22c55e; --yellow:#f5b301; --red:#ef4444; --orange:#f97316;
  --hover:#f3f4f6; --row-hover:#f8f9fb; --sel:#eef4ff;
  --shadow:0 10px 30px rgba(17,24,39,.14), 0 2px 6px rgba(17,24,39,.06);
  --header-h:52px; --subbar-h:46px;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font:13px/1.45 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
svg{display:block;flex:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px;border-radius:6px}
mark{background:#fff1b8;color:inherit;border-radius:2px;padding:0 1px}
a.link,.link{color:var(--accent);text-decoration:none;cursor:pointer}
.link:hover{text-decoration:underline}

/* ---------- shell (static copy of the layout) ---------- */
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--surface);border-bottom:1px solid var(--border)}
.top{height:var(--header-h);display:flex;align-items:center;gap:8px;padding:0 16px;border-bottom:1px solid var(--border)}
.subbar{height:var(--subbar-h);display:flex;align-items:center;gap:10px;padding:0 16px;background:#fafbfc}
.logo{font-weight:700;font-size:17px;letter-spacing:-.02em;color:#111827;white-space:nowrap;margin-right:6px;border:0;background:none;padding:0}
.logo .dot{color:var(--orange)} .logo .g{color:#9ca3af;font-weight:500}
.tools-btn{display:flex;align-items:center;gap:7px;height:32px;padding:0 10px;border:1px solid var(--border);border-radius:8px;background:#fff;white-space:nowrap;color:var(--text-2)}
.divider{width:1px;height:22px;background:var(--border);margin:0 4px}
.topnav{display:flex;align-items:center;gap:2px;flex:1;min-width:0;overflow:hidden}
.navitem{height:32px;padding:0 10px;border:0;border-radius:6px;background:transparent;white-space:nowrap;color:var(--text-2);display:inline-flex;align-items:center;gap:4px}
.navitem:hover{background:var(--hover);color:var(--text)}
.navitem.active{background:var(--accent-bg);color:var(--accent);font-weight:500}
.badge{display:inline-flex;align-items:center;justify-content:center;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--orange);color:#fff;font-size:11px;font-weight:600;margin-left:4px}
.top-right{display:flex;align-items:center;gap:10px;margin-left:auto;flex:none}
.team-btn{height:34px;display:flex;align-items:center;gap:8px;padding:0 10px;border:1px solid var(--border);border-radius:8px;background:#fff}
.team-btn .lbl{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;line-height:1}
.team-btn .val{font-weight:500;line-height:1.1;white-space:nowrap}
.team-btn .col{display:flex;flex-direction:column;gap:3px;text-align:left}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:600;border:0}
.pselect{width:960px;max-width:calc(100vw - 32px)}
.pselect .field{display:flex;align-items:center;gap:8px;height:34px;padding:0 10px;border:1px solid var(--border-strong);border-radius:8px;background:#fff;color:var(--muted)}
.main{padding:18px 20px 90px;min-width:0}

/* ---------- page head + toolbar ---------- */
.page-head{display:flex;align-items:center;gap:14px;margin-bottom:12px;flex-wrap:wrap}
.page-head h1{font-size:20px;font-weight:600;margin:0;letter-spacing:-.01em}
.seg{display:inline-flex;background:#eceef2;border-radius:8px;padding:2px}
.seg button{height:26px;padding:0 10px;border:0;border-radius:6px;background:transparent;color:var(--text-2);font-size:12.5px}
.seg button.on{background:#fff;color:var(--text);font-weight:500;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.spacer{flex:1}
.btn{height:32px;padding:0 12px;border-radius:8px;border:1px solid var(--border);background:#fff;display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--text);white-space:nowrap;position:relative}
.btn:hover{background:#fafafa;border-color:var(--border-strong)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:500}
.btn.primary:hover{background:var(--accent-hover)}
.btn.on{background:var(--accent-bg);border-color:#c7d7fe;color:var(--accent)}
.btn.icon{width:32px;padding:0;justify-content:center;color:var(--text-2)}
.btn .cnt{background:var(--accent);color:#fff;border-radius:9px;min-width:16px;height:16px;font-size:10.5px;display:inline-grid;place-items:center;padding:0 4px;font-weight:600}
.toolbar{display:flex;gap:8px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
.search{flex:1;min-width:260px;max-width:560px;height:34px;border:1px solid var(--border);border-radius:8px;padding:0 10px;background:#fff;display:flex;align-items:center;gap:8px;color:var(--muted)}
.search:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px rgba(37,99,235,.14)}
.search input{flex:1;border:0;outline:0;background:none;min-width:0;color:var(--text)}
.search input::placeholder{color:var(--muted)}
.search .hits{font-size:12px;white-space:nowrap}
.iconbtn{width:22px;height:22px;border:0;background:transparent;border-radius:5px;color:var(--muted);display:grid;place-items:center;flex:none}
.iconbtn:hover{background:var(--hover);color:var(--text)}
.tgroup{display:inline-flex;gap:0}
.tgroup .btn{border-radius:0;margin-left:-1px}
.tgroup .btn:first-child{border-radius:8px 0 0 8px;margin-left:0}
.tgroup .btn:last-child{border-radius:0 8px 8px 0}

/* chips */
.chips{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:10px;min-height:26px}
.chip{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 6px 0 10px;border-radius:13px;background:var(--accent-bg);color:#1e40af;font-size:12px;border:1px solid #d5e2fd;cursor:pointer}
.chip:hover{border-color:#a8c1fb}
.chip b{font-weight:500;color:#1e3a8a}
.chip .x{width:16px;height:16px;border-radius:50%;display:grid;place-items:center;color:#1e40af}
.chip .x:hover{background:#c7d7fe}
.chips .clear{color:var(--muted);font-size:12px;border:0;background:none;padding:0 4px}
.chips .clear:hover{color:var(--red)}
.chips .lbl{color:var(--muted);font-size:12px}

/* ---------- table ---------- */
.card{background:#fff;border:1px solid var(--border);border-radius:10px;overflow:hidden}
.tablewrap{overflow:auto;max-height:calc(100vh - 300px);position:relative}
table{border-collapse:separate;border-spacing:0;font-size:12.5px;table-layout:fixed}
th,td{padding:9px 12px;border-bottom:1px solid #eef0f3;vertical-align:top;text-align:left;overflow:hidden;text-overflow:ellipsis;background:#fff}
thead th{position:sticky;top:0;z-index:3;background:#fafbfc;border-bottom:1px solid var(--border);font-weight:600;color:var(--text-2);font-size:12px;white-space:nowrap;padding:0;height:38px;user-select:none}
th .thc{display:flex;align-items:center;gap:4px;height:38px;padding:0 8px 0 12px;position:relative}
th .thl{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;cursor:pointer;display:flex;align-items:center;gap:4px}
th.nosort .thl{cursor:default}
th .thl:hover{color:var(--text)}
th .sarr{color:var(--accent);display:none}
th.sorted .sarr{display:block}
th .mbtn{width:22px;height:22px;border:0;background:none;border-radius:5px;color:var(--muted);display:grid;place-items:center;opacity:0;flex:none}
th:hover .mbtn,th.filtered .mbtn,th.menu-open .mbtn{opacity:1}
th.filtered .mbtn{color:var(--accent);background:var(--accent-bg)}
th .mbtn:hover{background:var(--hover);color:var(--text)}
th .rz{position:absolute;right:-3px;top:0;width:7px;height:100%;cursor:col-resize;z-index:2}
th .rz:hover,th .rz.on{background:linear-gradient(to right,transparent 2px,var(--accent) 2px,var(--accent) 4px,transparent 4px)}
th.pinned,td.pinned{position:sticky;z-index:2}
thead th.pinned{z-index:4}
th.pinned-last,td.pinned-last{border-right:1px solid var(--border)}
.tablewrap.scrolled th.pinned-last,.tablewrap.scrolled td.pinned-last{box-shadow:4px 0 8px -4px rgba(17,24,39,.12)}
tbody tr:hover td{background:var(--row-hover)}
tbody tr.sel td{background:var(--sel)}
tbody tr:last-child td{border-bottom:0}
td.num,th.num .thc{text-align:right;justify-content:flex-end;font-variant-numeric:tabular-nums}
th.num .thl{justify-content:flex-end}
td.muted{color:var(--muted)}
td.chk,th.chk{width:40px;padding:0;text-align:center;vertical-align:middle}
td.chk input,th.chk input{width:15px;height:15px;margin:0;accent-color:var(--accent);cursor:pointer;vertical-align:middle}
.compact th,.compact td{padding-top:5px;padding-bottom:5px}
.compact thead th{height:32px} .compact th .thc{height:32px}
.compact .dom{line-height:1.35}
.id{color:var(--muted);font-variant-numeric:tabular-nums}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--green);flex:none;vertical-align:middle}
.dot.y{background:var(--yellow)} .dot.r{background:var(--red)} .dot.off{background:#c9cdd4}
.st{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.chipv{display:inline-block;padding:2px 8px;border-radius:6px;background:#eef2f7;color:#334155;font-size:11.5px;white-space:nowrap}
.dom{white-space:nowrap;line-height:1.5;overflow:hidden;text-overflow:ellipsis}
.dom .s{color:var(--muted);font-size:11px;margin-left:6px}
.pname{font-weight:500;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.dash{color:#c0c5cd}
.act{color:var(--muted);display:flex;gap:2px;justify-content:flex-end}
.act .iconbtn{opacity:0}
tr:hover .act .iconbtn{opacity:1}
.empty{padding:48px 20px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--text);font-weight:600;margin-bottom:4px}

/* footer / pagination */
.tfoot{display:flex;align-items:center;gap:14px;padding:10px 14px;border-top:1px solid var(--border);color:var(--muted);font-size:12px;flex-wrap:wrap;background:#fff}
.tfoot select{height:28px;border:1px solid var(--border);border-radius:6px;background:#fff;font-size:12px;color:var(--text-2);padding:0 6px}
.pages{display:flex;gap:2px;margin-left:auto}
.pages button{min-width:28px;height:28px;padding:0 6px;border:1px solid transparent;border-radius:6px;background:none;color:var(--text-2);font-size:12px;font-variant-numeric:tabular-nums}
.pages button:hover{background:var(--hover)}
.pages button.on{background:var(--accent-bg);color:var(--accent);font-weight:600}
.pages button:disabled{color:#c0c5cd;background:none;cursor:default}
.pages .dots{min-width:20px;display:grid;place-items:center;color:var(--muted)}

/* popovers */
.pop{position:fixed;z-index:100;background:#fff;border:1px solid var(--border);border-radius:10px;box-shadow:var(--shadow);padding:6px;min-width:220px;max-width:340px}
.pop .pi{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:6px;white-space:nowrap;width:100%;border:0;background:none;text-align:left;color:var(--text);font-size:12.5px}
.pop .pi:hover{background:var(--hover)}
.pop .pi.on{color:var(--accent);background:var(--accent-bg);font-weight:500}
.pop .pi.danger{color:var(--red)}
.pop .pi svg{color:var(--muted)} .pop .pi.on svg{color:var(--accent)}
.pop .pi .k{margin-left:auto;color:var(--muted);font-size:11px}
.pop hr{border:0;border-top:1px solid var(--border);margin:6px 0}
.pop .ph{padding:6px 10px 4px;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;display:flex;justify-content:space-between;gap:8px}
.pop .ph .link{text-transform:none;letter-spacing:0}
.pop .fsearch{width:100%;height:30px;border:1px solid var(--border);border-radius:6px;padding:0 8px;margin:2px 0 6px;outline:0}
.pop .fsearch:focus{border-color:var(--accent)}
.flist{max-height:240px;overflow:auto;display:flex;flex-direction:column;gap:1px}
.flist label{display:flex;align-items:center;gap:8px;padding:5px 8px;border-radius:6px;cursor:pointer;font-size:12.5px}
.flist label:hover{background:var(--hover)}
.flist input{width:14px;height:14px;margin:0;accent-color:var(--accent)}
.flist .v{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:flex;align-items:center;gap:6px}
.flist .c{color:var(--muted);font-size:11.5px;font-variant-numeric:tabular-nums}
.flist label.zero{color:var(--muted)}
.presets{display:flex;flex-wrap:wrap;gap:4px;padding:2px 4px 6px}
.presets button{height:26px;padding:0 9px;border:1px solid var(--border);border-radius:13px;background:#fff;font-size:12px;color:var(--text-2)}
.presets button.on{background:var(--accent-bg);border-color:#c7d7fe;color:var(--accent);font-weight:500}
.range{display:grid;grid-template-columns:1fr auto 1fr;gap:6px;align-items:center;padding:2px 4px 6px;color:var(--muted)}
.range input{height:30px;border:1px solid var(--border);border-radius:6px;padding:0 8px;width:100%;min-width:0;outline:0;font-size:12.5px}
.range input:focus{border-color:var(--accent)}
.radios{display:flex;flex-direction:column;gap:2px;padding:0 4px 4px}
.radios label{display:flex;align-items:center;gap:8px;padding:5px 6px;border-radius:6px;cursor:pointer;font-size:12.5px}
.radios label:hover{background:var(--hover)}
.radios input{margin:0;accent-color:var(--accent)}
.pop .foot{display:flex;justify-content:space-between;align-items:center;padding:6px 4px 2px;gap:8px}
.pop .foot .link{font-size:12px}
.pop .note{padding:4px 10px 6px;color:var(--muted);font-size:11.5px}
/* columns popover */
.cols li{display:flex;align-items:center;gap:8px;padding:5px 6px;border-radius:6px;list-style:none;font-size:12.5px;cursor:grab}
.cols li:hover{background:var(--hover)}
.cols li.dragging{opacity:.4}
.cols li.over{box-shadow:inset 0 2px 0 var(--accent)}
.cols{margin:0;padding:0;max-height:320px;overflow:auto}
.cols .grip{color:#c0c5cd;cursor:grab}
.cols input{width:14px;height:14px;margin:0;accent-color:var(--accent)}
.cols .nm{flex:1}
.cols .pinb{width:22px;height:22px;border:0;background:none;border-radius:5px;color:#c0c5cd;display:grid;place-items:center}
.cols .pinb.on,.cols .pinb:hover{color:var(--accent);background:var(--accent-bg)}
.cols li.fixed{color:var(--muted);cursor:default}
/* views */
.vname{display:flex;gap:6px;padding:4px}
.vname input{flex:1;height:30px;border:1px solid var(--border);border-radius:6px;padding:0 8px;outline:0;min-width:0}
.vname input:focus{border-color:var(--accent)}
.vname .btn{height:30px}
.pop .pi .del{margin-left:auto;width:20px;height:20px;border-radius:5px;display:grid;place-items:center;color:#c0c5cd;opacity:0}
.pop .pi:hover .del{opacity:1}
.pop .pi .del:hover{color:var(--red);background:#fee2e2}
/* bulk bar */
.bulk{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:90;background:#111827;color:#fff;border-radius:12px;padding:8px 8px 8px 16px;display:flex;align-items:center;gap:6px;box-shadow:0 12px 32px rgba(17,24,39,.3);font-size:12.5px;white-space:nowrap;max-width:calc(100vw - 32px)}
.bulk b{font-weight:600;margin-right:6px}
.bulk .link{color:#93c5fd}
.bulk .bb{height:30px;padding:0 10px;border:0;border-radius:8px;background:rgba(255,255,255,.08);color:#fff;font-size:12.5px;display:inline-flex;align-items:center;gap:6px}
.bulk .bb:hover{background:rgba(255,255,255,.16)}
.bulk .bb.danger:hover{background:#7f1d1d}
.bulk .sep{width:1px;height:20px;background:rgba(255,255,255,.15);margin:0 4px}
.bulk .x{width:30px;height:30px;border:0;background:none;color:#9ca3af;border-radius:8px;display:grid;place-items:center}
.bulk .x:hover{background:rgba(255,255,255,.1);color:#fff}
/* toast */
.toast{position:fixed;left:50%;bottom:80px;transform:translateX(-50%);z-index:120;background:#fff;border:1px solid var(--border);box-shadow:var(--shadow);border-radius:10px;padding:10px 14px;font-size:12.5px;display:flex;gap:8px;align-items:center;color:var(--text);pointer-events:none}
.toast .ok{color:var(--green)}
.kbd{font:11px/1 ui-monospace,Menlo,monospace;background:#f3f4f6;border:1px solid var(--border);border-radius:4px;padding:2px 5px;color:var(--text-2)}
@media (max-width:820px){.team-btn .col{display:none}.tools-btn span{display:none}.tablewrap{max-height:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

</head>
<body>
<div class="hdr">
  <header class="top">
    <button class="logo">zavod<span class="dot">.</span><span class="g">guru</span></button>
    <button class="tools-btn"><svg width="14" height="14" viewBox="0 0 14 14" fill="currentColor"><rect width="4" height="4" rx="1"/><rect x="5" width="4" height="4" rx="1"/><rect x="10" width="4" height="4" rx="1"/><rect y="5" width="4" height="4" rx="1"/><rect x="5" y="5" width="4" height="4" rx="1"/><rect x="10" y="5" width="4" height="4" rx="1"/><rect y="10" width="4" height="4" rx="1"/><rect x="5" y="10" width="4" height="4" rx="1"/><rect x="10" y="10" width="4" height="4" rx="1"/></svg><span>Все инструменты</span></button>
    <div class="divider"></div>
    <nav class="topnav"><button class="navitem active">Проекты</button><button class="navitem">Домены</button><button class="navitem">Схемы</button><button class="navitem">Казино</button><button class="navitem">Задачи</button><button class="navitem">Выкуп доменов<span class="badge">28</span></button><button class="navitem">Мониторинг</button></nav>
    <div class="top-right">
      <button class="team-btn"><span class="col"><span class="lbl">Показывать данные</span><span class="val">Команда Кости</span></span><svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4.5l3 3 3-3"/></svg></button>
      <button class="avatar">С</button>
    </div>
  </header>
  <div class="subbar"><div class="pselect"><div class="field"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5L14 14" stroke-linecap="round"/></svg>Выбрать проект: название или домен…</div></div></div>
</div>

<main class="main" id="main">
  <div class="page-head">
    <h1>Проекты</h1>
    <div class="seg" id="seg"></div>
    <button class="btn" id="viewsBtn"></button>
    <div class="spacer"></div>
    <button class="btn primary">+ Добавить проект</button>
  </div>
  <div class="toolbar" id="toolbar"></div>
  <div class="chips" id="chips"></div>
  <div class="card">
    <div class="tablewrap" id="tablewrap"></div>
    <div class="tfoot" id="tfoot"></div>
  </div>
</main>
<div id="pop"></div>
<div id="bulk"></div>
<div id="toast"></div>

/* ---------- export ---------- */
function doExport(fmt) {
  const rows = S.selected.size ? _result.filter(r => S.selected.has(r.id)) : _result;
  const cols = (S.exportAll ? COLUMNS.map(c => c.key) : visibleCols()).filter(k => !COL[k].fixed);
  const head = cols.map(k => COL[k].label), data = rows.map(r => cols.map(k => COL[k].csv(r)));
  const name = `projects_${iso(TODAY)}${S.selected.size ? '_selected' : ''}`;
  try {
    if (fmt === 'xlsx' && window.XLSX) {
      const ws = XLSX.utils.aoa_to_sheet([head, ...data]); const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, 'Проекты'); XLSX.writeFile(wb, name + '.xlsx');
    } else {
      const csv = '﻿' + [head, ...data].map(r => r.map(v => { v = String(v ?? ''); return /[;"\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; }).join(';')).join('\r\n');
      const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' })); a.download = name + '.csv'; document.body.appendChild(a); a.click(); a.remove();
    }
  } catch (e) {}
  toast(`Файл <b>${name}.${fmt}</b> сформирован: ${fmtNum(rows.length)} строк, ${cols.length} столбцов`);
}

/* =========================================================
   EVENTS
   ========================================================= */
function setFilter(k, f) { S.filters[k] = f; S.page = 1; S.activeView = null; }
function clearFilter(k) { delete S.filters[k]; S.page = 1; }

document.addEventListener('click', e => {
  const t = e.target, c = s => t.closest(s);
  const inPop = c('#pop');

  // ---- menus open/close
  const mb = c('[data-menu]');
  if (mb && !c('.x')) { const kind = mb.dataset.menu, key = mb.dataset.key;
    if (S.menu && S.menu.kind === kind && S.menu.key === key) return closeMenu();
    return openMenu(kind, key, mb); }
  if (!inPop && !c('.bulk')) { if (S.menu) { S.menu = null; render(); } }

  // ---- tabs / paging
  const tab = c('[data-tab]'); if (tab) { S.tab = tab.dataset.tab; S.page = 1; S.selected.clear(); return render(); }
  const pg = c('[data-page]'); if (pg && !pg.disabled) { S.page = +pg.dataset.page; return render(); }

  // ---- sort
  const srt = c('[data-sort]'); if (srt) { const k = srt.dataset.sort; S.sort = S.sort.key === k ? { key: k, dir: S.sort.dir === 'asc' ? 'desc' : 'asc' } : { key: k, dir: COL[k].type === 'text' || COL[k].type === 'enum' ? 'asc' : 'desc' }; S.activeView = null; return render(); }
  const ss = c('[data-setsort]'); if (ss) { const [k, d] = ss.dataset.setsort.split(':'); S.sort = { key: k, dir: d }; S.activeView = null; return render(); }

  // ---- filters
  const fall = c('[data-fall]'); if (fall) { clearFilter(fall.dataset.fall); return render(); }
  const fnone = c('[data-fnone]'); if (fnone) { setFilter(fnone.dataset.fnone, { values: [] }); return render(); }
  const fd = c('[data-fdate]'); if (fd) { const [k, p] = fd.dataset.fdate.split(':'); p === 'all' ? clearFilter(k) : setFilter(k, { preset: p }); return render(); }
  const uf = c('[data-unfilter]'); if (uf) { e.stopPropagation(); clearFilter(uf.dataset.unfilter); if (S.menu && S.menu.kind === 'col' && S.menu.key === uf.dataset.unfilter && c('.chip')) S.menu = null; return render(); }
  if (c('[data-alerts]')) { S.alertsOnly = !S.alertsOnly; S.page = 1; S.activeView = null; return render(); }
  if (c('[data-clearfilters]')) { S.filters = {}; S.alertsOnly = false; S.page = 1; S.activeView = null; return render(); }
  if (c('[data-resetall]')) { S.filters = {}; S.alertsOnly = false; S.q = ''; S.sort = { key: 'id', dir: 'desc' }; S.page = 1; S.activeView = null; return render(); }
  if (c('[data-clearq]')) { S.q = ''; S.page = 1; render(); $('#q').focus(); return; }

  // ---- columns
  const hc = c('[data-hidecol]'); if (hc) { const k = hc.dataset.hidecol; if (!S.profile.hidden.includes(k)) S.profile.hidden.push(k); saveProfile(); S.menu = null; toast(`Столбец «${COL[k].label}» скрыт. Вернуть: кнопка «Колонки»`); return render(); }
  const pc = c('[data-pincol]'); if (pc) { e.stopPropagation(); const k = pc.dataset.pincol, p = S.profile.pinned; p.includes(k) ? p.splice(p.indexOf(k), 1) : p.push(k); saveProfile(); if (S.menu && S.menu.kind === 'col') S.menu = null; return render(); }
  if (c('[data-colsreset]')) { const d = DEFAULT_PROFILE(); Object.assign(S.profile, { order: d.order, hidden: d.hidden, pinned: d.pinned, widths: {} }); saveProfile(); return render(); }
  if (c('[data-density]')) { S.profile.density = S.profile.density === 'compact' ? 'normal' : 'compact'; saveProfile(); return render(); }

  // ---- export
  const ex = c('[data-export]'); if (ex) { doExport(ex.dataset.export); S.menu = null; return render(); }

  // ---- views
  const av = c('[data-applyview]'); if (av && !c('.del')) { applyView(av.dataset.applyview); S.menu = null; return render(); }
  const dv = c('[data-delview]'); if (dv) { e.stopPropagation(); S.views = S.views.filter(v => v.id !== dv.dataset.delview); if (S.activeView === dv.dataset.delview) S.activeView = null; store.set('views', S.views); return render(); }
  if (c('[data-saveview]')) return saveView();

  // ---- selection / bulk
  if (c('[data-selall-filtered]')) { _result.forEach(r => S.selected.add(r.id)); return render(); }
  if (c('[data-unselect]')) { S.selected.clear(); return render(); }
  const bk = c('[data-bulk]'); if (bk) { const a = bk.dataset.bulk;
    if (a === 'export') { doExport('xlsx'); return; }
    if (a === 'status') return openMenu('bulkstatus', null, bk);
    if (a === 'template') return openMenu('bulktemplate', null, bk);
    if (a === 'archive') { const n = S.selected.size; ROWS.forEach(r => { if (S.selected.has(r.id)) r.archived = S.tab !== 'archive'; }); S.selected.clear(); toast(`${n} проектов ${S.tab === 'archive' ? 'возвращено из архива' : 'перенесено в архив'}`); return render(); } }
  const bs = c('[data-bulkset]'); if (bs) { const [f, v] = bs.dataset.bulkset.split(':'); const n = S.selected.size; ROWS.forEach(r => { if (S.selected.has(r.id)) r[f] = v; }); S.menu = null; toast(`${f === 'status' ? 'Статус' : 'Шаблон'} изменён у ${n} проектов`); return render(); }
});

document.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'selall') { pageRows().forEach(r => t.checked ? S.selected.add(r.id) : S.selected.delete(r.id)); return render(); }
  if (t.dataset.sel) { t.checked ? S.selected.add(+t.dataset.sel) : S.selected.delete(+t.dataset.sel); return render(); }
  if (t.id === 'pagesize') { S.profile.pageSize = +t.value; S.page = 1; saveProfile(); return render(); }
  if (t.dataset.fval) { const k = t.dataset.fval, vals = enumValues(k), cur = S.filters[k] && Array.isArray(S.filters[k].values) ? [...S.filters[k].values] : [...vals];
    t.checked ? (cur.includes(t.value) || cur.push(t.value)) : cur.splice(cur.indexOf(t.value), 1);
    cur.length === vals.length ? clearFilter(k) : setFilter(k, { values: vals.filter(v => cur.includes(v)) }); return render(); }
  if (t.dataset.ffrom || t.dataset.fto) { const k = t.dataset.ffrom || t.dataset.fto; const f = Object.assign({}, S.filters[k] || {}); f.preset = 'custom'; if (t.dataset.ffrom) f.from = t.value || ''; else f.to = t.value || ''; (!f.from && !f.to) ? clearFilter(k) : setFilter(k, f); return render(); }
  if (t.dataset.fmin || t.dataset.fmax || t.dataset.fempty) { const k = t.dataset.fmin || t.dataset.fmax || t.dataset.fempty; const f = Object.assign({ min: null, max: null, empty: 'any' }, S.filters[k] || {});
    if (t.dataset.fmin) f.min = t.value === '' ? null : +t.value; if (t.dataset.fmax) f.max = t.value === '' ? null : +t.value; if (t.dataset.fempty) f.empty = t.value;
    (f.min == null && f.max == null && f.empty === 'any') ? clearFilter(k) : setFilter(k, f); return render(); }
  if (t.dataset.colvis) { const k = t.dataset.colvis, h = S.profile.hidden; t.checked ? h.splice(h.indexOf(k), 1) : (h.includes(k) || h.push(k)); saveProfile(); return render(); }
  if (t.dataset.excols != null) { S.exportAll = t.dataset.excols === '1'; }
});

let _qT;
document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'q') { clearTimeout(_qT); _qT = setTimeout(() => { S.q = t.value; S.page = 1; S.activeView = null; const pos = t.selectionStart; render(); const q = $('#q'); q.focus(); q.setSelectionRange(pos, pos); }, 180); }
  if (t.dataset.fsearch != null) { S.fsearch = t.value; S.menu.focusSearch = true; renderMenu(); }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { if (S.menu) return closeMenu(); if (document.activeElement && document.activeElement.id === 'q' && S.q) { S.q = ''; render(); $('#q').focus(); } return; }
  if (e.key === '/' && !['INPUT', 'TEXTAREA', 'SELECT'].includes(document.activeElement.tagName)) { e.preventDefault(); $('#q').focus(); }
  if (e.key === 'Enter' && e.target.id === 'vname') saveView();
});
function saveView() {
  const inp = $('#vname'); const name = (inp && inp.value.trim()) || `Вид ${S.views.length + 1}`;
  const v = { id: String(Date.now()), name, tab: S.tab, q: S.q, sort: S.sort, filters: JSON.parse(JSON.stringify(S.filters)), alertsOnly: S.alertsOnly, hidden: [...S.profile.hidden], order: [...S.profile.order], pinned: [...S.profile.pinned] };
  S.views.push(v); S.activeView = v.id; store.set('views', S.views); S.menu = null; toast(`Вид «${esc(name)}» сохранён`); render();
}
function applyView(id) {
  if (!id) { S.activeView = null; S.filters = {}; S.q = ''; S.alertsOnly = false; S.sort = { key: 'id', dir: 'desc' }; S.page = 1; return; }
  const v = S.views.find(x => x.id === id); if (!v) return;
  Object.assign(S, { tab: v.tab, q: v.q, sort: v.sort, filters: JSON.parse(JSON.stringify(v.filters)), alertsOnly: v.alertsOnly, page: 1, activeView: id });
  Object.assign(S.profile, { hidden: [...v.hidden], order: [...v.order], pinned: [...v.pinned] }); saveProfile();
}

/* ---------- column resize ---------- */
let _rz = null;
document.addEventListener('mousedown', e => {
  const h = e.target.closest('[data-rz]'); if (!h) return;
  e.preventDefault(); const k = h.dataset.rz;
  _rz = { k, x: e.clientX, w: colWidth(k), h }; h.classList.add('on'); document.body.style.cursor = 'col-resize'; document.body.style.userSelect = 'none';
});
document.addEventListener('mousemove', e => {
  if (!_rz) return; const w = Math.max(56, _rz.w + e.clientX - _rz.x); S.profile.widths[_rz.k] = w;
  const cols = visibleCols(), idx = cols.indexOf(_rz.k) + 1, tbl = $('#tablewrap table');
  tbl.querySelectorAll('col')[idx].style.width = w + 'px'; tbl.querySelector(`th[data-col="${_rz.k}"]`).style.width = w + 'px';
  tbl.style.width = (40 + cols.reduce((a, c) => a + colWidth(c), 0)) + 'px';
});
document.addEventListener('mouseup', () => { if (!_rz) return; _rz.h.classList.remove('on'); _rz = null; document.body.style.cursor = ''; document.body.style.userSelect = ''; saveProfile(); render(); });
document.addEventListener('dblclick', e => { const h = e.target.closest('[data-rz]'); if (h) { delete S.profile.widths[h.dataset.rz]; saveProfile(); render(); } });

/* ---------- column drag reorder ---------- */
let _drag = null;
document.addEventListener('dragstart', e => { const li = e.target.closest('[data-drag]'); if (!li) return; _drag = li.dataset.drag; li.classList.add('dragging'); e.dataTransfer.effectAllowed = 'move'; });
document.addEventListener('dragover', e => { const li = e.target.closest('[data-drag]'); if (!li || !_drag) return; e.preventDefault(); document.querySelectorAll('.cols li.over').forEach(x => x.classList.remove('over')); li.classList.add('over'); });
document.addEventListener('dragend', () => { document.querySelectorAll('.cols li.over,.cols li.dragging').forEach(x => x.classList.remove('over', 'dragging')); _drag = null; });
document.addEventListener('drop', e => {
  const li = e.target.closest('[data-drag]'); if (!li || !_drag || li.dataset.drag === _drag) return; e.preventDefault();
  const target = li.dataset.drag, o = S.profile.order, p = S.profile.pinned;
  // keep pin zones consistent: dragging into pinned zone pins, out of it unpins
  const tp = p.includes(target); if (tp && !p.includes(_drag)) p.push(_drag); if (!tp && p.includes(_drag)) p.splice(p.indexOf(_drag), 1);
  const list = tp ? p : o; if (tp) { list.splice(list.indexOf(_drag), 1); list.splice(list.indexOf(target), 0, _drag); }
  o.splice(o.indexOf(_drag), 1); o.splice(o.indexOf(target), 0, _drag);
  saveProfile(); _drag = null; render();
});
$('#tablewrap').addEventListener('scroll', e => e.target.classList.toggle('scrolled', e.target.scrollLeft > 0));
window.addEventListener('resize', () => { if (S.menu) renderMenu(); });

readHash();
render();
</script>
